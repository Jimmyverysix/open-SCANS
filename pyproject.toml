[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-scans"
version = "0.1.0"
description = "Official implementation of Support-Constrained Adaptive Negative Sampling for hyperedge prediction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Jinming Yang"},
  {name = "Zhenyu Deng"},
  {name = "Shimin Cai"},
  {name = "Tao Zhou"},
]
keywords = [
  "hypergraph",
  "hyperedge prediction",
  "negative sampling",
  "diffusion models",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/Jimmyverysix/open-SCANS"
Issues = "https://github.com/Jimmyverysix/open-SCANS/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
